- name: loops
  hosts: all
  become: true
  connection: local
  tasks:
  - name: name the install packages
    ansible.builtin.packages:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
      - { name: nginx, state: present }
      - { name: httpd, state: absent }
      - { name: zip, state: present }


